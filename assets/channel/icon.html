<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&display=swap');
html,body{margin:0;width:800px;height:800px;overflow:hidden;
  background:radial-gradient(circle at 50% 38%,#7a1f2b 0%,#4a0f19 55%,#260509 100%);font-family:'Noto Serif JP',serif}
.drop{position:absolute;left:310px;top:150px;width:180px;height:180px;border-radius:0 50% 50% 50%;transform:rotate(45deg);
  background:linear-gradient(135deg,#fff6d8 0%,#f1c75b 55%,#c8902a 100%);box-shadow:0 0 60px rgba(255,214,120,.55)}
.drop:after{content:"";position:absolute;left:46px;top:40px;width:40px;height:62px;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-45deg)}
.t{position:absolute;left:0;right:0;top:405px;text-align:center;font-weight:900;font-size:190px;color:#fbe7b0;letter-spacing:8px;
  text-shadow:0 6px 0 #2a0408,0 0 40px rgba(255,200,110,.35)}
.s{position:absolute;left:0;right:0;top:640px;text-align:center;font-weight:900;font-size:62px;color:#e8c37a;letter-spacing:30px;padding-left:30px}
</style></head><body><div class="drop"></div><div class="t">ほろり</div><div class="s">劇場</div></body></html>
